# Railway config-as-code was removed on purpose: with two services building
# from this repo root (web nginx + PvP game server), a shared railway.toml
# would force one Dockerfile path and one healthcheck onto both. Each service
# is now configured in the Railway dashboard instead:
#   web service -> auto-detected root Dockerfile (nginx serving web/)
#   PvP service -> custom Dockerfile path: Dockerfile.server
# Optional per-service healthcheck (web only): /healthz
