server {
    listen 9123;
    server_name _;

    # Railway's HTTP edge probes the service before routing; answer it here so
    # the WebSocket-only Godot process never has to see a plain GET.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Browsers that open the domain directly get a readable hint instead of a
    # dropped connection.
    location / {
        if ($http_upgrade = "") {
            default_type text/plain;
            return 426 "This is a PvP WebSocket server. Connect with wss://\n";
        }
        proxy_pass http://127.0.0.1:9124;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
